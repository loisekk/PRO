name: generate contribution skyline

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/skyline.py

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: render skyline svg
        run: python scripts/skyline.py
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dedicated branch: keeps the main history clean and leaves the existing
      # `output` branch (pixel-name.svg) untouched.
      - name: publish to skyline-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: skyline-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
